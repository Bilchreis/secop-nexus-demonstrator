services:
  gas_dosing:
    build:
      context: .
      dockerfile: Dockerfile_gas_dosing
    ports:
      - '10800:10800'
    stdin_open: true # docker run -i
    tty: true        # docker run -t
  
  reactor_cell:
    build:
      context: .
      dockerfile: Dockerfile_reactor_cell
    ports:
      - '10801:10801'
    stdin_open: true # docker run -i
    tty: true        # docker run -t

  mongodb:
      image:  mongo:7.0.5
      container_name: mongodb
      network_mode: host
      restart: always
      environment:
        - MONGO_INITDB_ROOT_USERNAME=admin
        - MONGO_INITDB_ROOT_PASSWORD=password
        - MONGO_INITDB_DATABASE=bluesky
      volumes:
        - ./data:/data/db
        - ./db_scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
        - "/etc/localtime:/etc/localtime:ro"
        - "/etc/timezone:/etc/timezone:ro"  
      



  tiled:
    image: registry.hzdr.de/hzb/bluesky/tutorials/bluesky_training:latest
    user: root:root
    privileged: true
    network_mode: host
    container_name: tiled
    stdin_open: true
    tty: true
    environment:
        - TILED_SINGLE_USER_API_KEY=secret
    restart: always
    volumes:
        - $PWD/tiled_config:/opt/bluesky/deploy/config:ro
        - ./data2:/opt/bluesky/storage:rw
        - ./images:/home/epics/images:rw
    command: /bin/bash -c 'tiled serve config /opt/bluesky/deploy/config/config.yml'









